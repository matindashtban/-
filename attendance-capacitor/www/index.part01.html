<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حضور و غیاب کلاس</title>
<style>
:root{--card:#fff;--soft:#f1f4f9;--soft2:#e9eefb;--line:#d5dbe6;--bad:#ffe3e3;--warnbg:#fff3cd;--page:#e8f6ff;--dot:#cbe8fb;--ink:#2b2d42;--mute:#6c757d;--p:#2ec4b6;--a:#ef476f;--l:#ff9f1c;--b:#4361ee}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.6;background-color:var(--page);background-image:radial-gradient(var(--dot) 2px,transparent 2px);background-size:26px 26px}
.wrap{max-width:780px;margin:0 auto;padding:12px}
header{background:linear-gradient(135deg,#ffb703,#ff6b9d);color:#fff;border-radius:26px;padding:16px 18px;margin-bottom:12px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
header h1{margin:0 0 8px;font-size:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,textarea,button{font:inherit}
input[type=text],input[type=date],input[type=number],textarea{border:2px solid var(--line);border-radius:14px;padding:6px 12px;background:var(--card);color:var(--ink)}
header input{border:0}
.jdate{margin-top:6px;font-size:15px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;font-size:17px;padding:10px;border-radius:18px;border:0;background:var(--card);box-shadow:0 3px 0 rgba(0,0,0,.08);cursor:pointer}
.tabs button.on{background:var(--b);color:#fff}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7fb3d5;outline-offset:1px}
.btn{border:0;border-radius:16px;padding:9px 16px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.1)}
.btn.main{background:var(--b);color:#fff}
.sum{display:flex;gap:8px;margin-bottom:12px}
.sum div{flex:1;border-radius:20px;padding:8px;text-align:center;color:#fff;font-size:15px}
.sum b{display:block;font-size:26px;line-height:1.2}
.sum .p{background:var(--p)}.sum .a{background:var(--a)}.sum .l{background:var(--l)}
.warn{background:var(--warnbg);border-radius:16px;padding:10px 14px;margin-bottom:12px;display:none}
.bar{margin-bottom:12px}
.st{background:var(--card);border-radius:20px;padding:10px 12px;margin-bottom:10px;box-shadow:0 3px 0 rgba(0,0,0,.07);border-right:10px solid var(--c,var(--p))}
.st.a{--c:var(--a)}.st.l{--c:var(--l)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.av{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;flex:none}
.name{flex:1;min-width:120px;font-size:18px;font-weight:bold}
.name small{font-weight:normal;color:var(--mute);margin-inline-start:6px}
.seg{display:flex;gap:6px;align-items:center}
.seg button{--c:var(--p);border:2px solid var(--c);color:var(--c);background:var(--card);border-radius:16px;padding:6px 12px;font-size:15px}
.seg button.a{--c:var(--a)}.seg button.l{--c:var(--l)}
.seg button.on{background:var(--c);color:#fff}
.seg .del{border-color:var(--line);color:var(--mute);padding:6px 9px;font-size:13px}
.extra{display:flex;gap:8px;margin-top:8px}
.extra input{border-color:var(--c)}
.extra .why{flex:1;min-width:0}
.min{width:90px}
.card{background:var(--card);border-radius:20px;padding:12px 14px;margin-bottom:12px;box-shadow:0 3px 0 rgba(0,0,0,.07)}
.hint{color:var(--mute);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{border:2px solid var(--b);background:var(--card);color:var(--b);border-radius:16px;padding:4px 12px}
.pill{display:inline-block;color:#fff;border-radius:12px;padding:0 10px;font-size:14px}
.h{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.h:last-child{border:0}
.h .d{width:150px;flex:none;font-size:14px}
details summary{cursor:pointer;font-weight:bold}
textarea{width:100%;height:120px;margin:8px 0}
@media(max-width:480px){.seg button{padding:5px 8px;font-size:14px}.h{flex-wrap:wrap}}
.tabs{flex-wrap:wrap}.tabs button{font-size:15px;padding:8px 6px;min-width:45%}
img.av{object-fit:cover}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.fg input{width:100%}
.rr{display:grid;grid-template-columns:36px 1fr 52px 52px 52px 60px;gap:4px;padding:6px;border-bottom:1px dashed var(--line);font-size:15px}
.rr.hd{font-weight:bold;background:var(--soft2);border-radius:10px}.rr.bad{background:var(--bad)}
select{font:inherit;border:2px solid var(--line);border-radius:14px;padding:6px 10px;background:var(--card)}
.tabs button{min-width:30%}
.big{font-size:22px;padding:14px 18px;color:#fff}
.bar2{height:16px;background:var(--a);border-radius:8px;min-width:2px}
#pr{display:none}
@media print{.wrap{display:none}#pr{display:block;padding:16px;color:#000;direction:rtl}}
#cal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:9}
#cal[hidden]{display:none}
#cal .box{background:var(--card);border-radius:22px;padding:14px;width:min(340px,94vw)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg button{border:0;border-radius:12px;padding:8px 0;background:var(--soft);font:inherit;cursor:pointer}
.cg button.sel{background:var(--b);color:#fff}.cg button.td{outline:2px solid var(--l)}.cg button.fr{color:var(--a)}
.cg .wd{font-size:13px;color:var(--mute);padding:4px 0}
.st.u{--c:#adb5bd}
@media print{body{background:#fff!important}}
button{color:var(--ink)}
select{color:var(--ink)}
.warn.bad{background:var(--bad)}
html.dk{color-scheme:dark;--card:#232a36;--soft:#2d3544;--soft2:#34405a;--line:#3d4658;--bad:#4a2530;--warnbg:#4a4020;--page:#141922;--dot:#1d2431;--ink:#e8eaf0;--mute:#9aa4b2;--b:#5468e8}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🌈 حضور و غیاب کلاس</h1>
  <div class="row">
    <select id="csel" aria-label="انتخاب کلاس"></select><button class="btn" id="cnew">➕ کلاس جدید</button>
    <input type="text" id="cls" placeholder="نام کلاس (مثلاً اول الف)" aria-label="نام کلاس">
    <button class="btn" id="prev" aria-label="روز قبل">›</button><input type="date" id="date" aria-label="تاریخ"><button class="btn" id="next" aria-label="روز بعد">‹</button><button class="btn" id="hol"></button>
  </div>
  <div class="jdate"><span id="jdate"></span> <span id="saved"></span> <span id="sv"></span> <button class="btn" id="dk" aria-label="حالت تاریک">🌙</button></div>
</header>
<div class="warn" id="warn">💾 مدتی است نسخه پشتیبان نگرفته‌اید. <button class="btn" id="bk0">ذ
