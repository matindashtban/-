name: Build Attendance Capacitor APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'attendance-capacitor/**'
      - '.github/workflows/android-capacitor.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install dependencies
        working-directory: attendance-capacitor
        run: npm install

      - name: Assemble application source
        working-directory: attendance-capacitor
        run: |
          cat src/app.part*.js > src/app.js
          cat www/index.part*.html > www/index.html

      - name: Check application JavaScript
        working-directory: attendance-capacitor
        run: node --check src/app.js

      - name: Create Android project
        working-directory: attendance-capacitor
        run: npx cap add android

      - name: Build web bundle
        working-directory: attendance-capacitor
        run: npm run build

      - name: Sync Capacitor
        working-directory: attendance-capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: attendance-capacitor/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: attendance-capacitor-debug-apk
          path: attendance-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
